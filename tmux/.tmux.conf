# Unbind default prefix
unbind C-b
# Set new prefix
set-option -g prefix C-space
# Bind C-space to send-prefix so you can still use C-space in shell
bind-key C-space send-prefix

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Select panes using Alt-arrow keys without prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5

# lazygit integration
bind-key C-g display-popup -E -d "#{pane_current_path}" -xC -yC -w 80% -h 75% "lazygit"

# Enable mouse support for pane selection and resizing
set -g mouse on

# set 256 color support
set -g default-terminal "tmux-256color"

# Reload tmux config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# mux integration
# check this repo https://github.com/lunemis/mux
bind m display-popup -E -w 85% -h 80% "/home/jwh9456/go/bin/mux"  # mux popup keybinding
set -g status-right '#(mux status)'

# sesh integration (tmux session manager)
# https://github.com/joshmedeski/sesh
set -g detach-on-destroy off  # 세션 kill 시 detach 대신 다음 세션으로 전환
bind-key T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' --preview 'sesh preview {}'
)\""

# catppuccin theme
# run this cmd before setting the flavor and styles to avoid errors about missing variables
# git clone -b v2.3.0 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux
# stow tmux -> git clone -> tmux source ~/.tmux.conf
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_battery}"
# set -ag status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
