# Destination (INSIDE the Arch distro):  /etc/wsl.conf   (needs sudo to write)
# Per-distro settings. After editing, run `wsl --shutdown` from Windows to apply.
# Docs: https://learn.microsoft.com/windows/wsl/wsl-config#wslconf

[boot]
# Enable systemd (services, timers, etc.). Supported on recent WSL.
systemd=true

[user]
# Default login user for this distro — CHANGE THIS to your WSL username.
default=CHANGE_ME

[automount]
# Mount Windows drives under /mnt with sane file permissions.
enabled=true
options=metadata,umask=22,fmask=11
mountFsTab=true

[interop]
# Allow running Windows .exe — required for win32yank.exe, powershell.exe, wslview.
enabled=true
appendWindowsPath=true

[network]
generateHosts=true
generateResolvConf=true
