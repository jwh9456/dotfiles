<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!-- Share fonts installed in the Windows side so WSL apps see them too. -->
	<dir>/mnt/c/Windows/Fonts</dir>

	<alias>
		<family>sans-serif</family>
		<prefer><family>Pretendard</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer><family>Pretendard</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>0xProto Nerd Font Mono</family></prefer>
	</alias>
</fontconfig>
